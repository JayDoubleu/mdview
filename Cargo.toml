[package]
name = "mdview"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight, cross-platform Markdown viewer with GitHub flavoured rendering, a file tree and a source pane"
license = "MIT"
repository = "https://github.com/JayDoubleu/mdview"
readme = "README.md"
keywords = ["markdown", "viewer", "gfm", "preview"]
categories = ["text-processing", "gui"]
exclude = ["/.github", "/docs"]

[dependencies]
ammonia = "4"
comrak = { version = "0.56", default-features = false, features = ["syntect-fancy", "shortcodes"] }
dirs = "7"
dunce = "1"
interprocess = "2"
notify = "8"
open = "5"
percent-encoding = "2"
png = "0.18"
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tao = "0.37"
wry = "0.57"

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
# Same version wry uses; only needed to tune WebKitGTK settings.
webkit2gtk = "=2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
# Same versions tao uses; only needed to give the Dock an icon.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3"
